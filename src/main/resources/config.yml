# Время игры в секундах
game-duration: 300

# Минимальное количество игроков для начала отсчета
min-number-of-players: 2

# --- Точки охраны / заключённого / клетки (spawn.guard, spawn.prisoner, cell) ---
# При матче координаты применяются в мире текущей арены (run_*); world ниже не важен.
# Можно переопределить в игре: /etm setspawn guard|prisoner|cell

spawn:
  guard:
    world: world
    x: 10
    y: 4
    z: -10
    yaw: 0
    pitch: 0
  prisoner:
    world: world
    x: 0
    y: 4
    z: -10
    yaw: 0
    pitch: 0

cell:
  world: world
  x: 10
  y: 4
  z: 0
  yaw: 0
  pitch: 0

# Лобби: /lobby, выход с арены (мир world)
lobby:
  world: world
  x: 20
  y: 56
  z: 0
  yaw: 0
  pitch: 0

# Список верстаков (резерв, сейчас не используется)
computers: []
